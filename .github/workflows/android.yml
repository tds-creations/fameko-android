name: Android CI/CD

on:
  push:
    branches: [ "main" ] # Change to "master" if your repository primary branch is named master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x ./gradlew

    - name: Create local.properties and Inject All Keys
