name: Android CI/CD

on:
  push:
    branches: [ "main" ] # If your primary branch is named 'master', change "main" to "master"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x ./gradlew

    - name: Create local.properties and Inject Placeholder Keys
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "MAPS_API_KEY=AIzaSyFakeKey_ForGitHubActionsDebugBuildsOnly" >> local.properties

    - name: Build Debug APK
      env:
        MAPS_API_KEY: "AIzaSyFakeKey_ForGitHubActionsDebugBuildsOnly"
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
